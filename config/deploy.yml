service: vastos-api
image: kavinram247/vastos-api

builder:
  arch: amd64

servers:
  web:
    hosts:
      - 89.116.121.54

# kamal-proxy owns 80/443 on the server: health-checked container swap,
# zero downtime, automatic rollback on failed health check, and its own
# Let's Encrypt TLS.
proxy:
  ssl: true
  host: api.vastos.in
  app_port: 3000
  healthcheck:
    path: /health
    interval: 5
    timeout: 5

registry:
  server: ghcr.io
  username: kavinram247
  password:
    - KAMAL_REGISTRY_PASSWORD

# ALLOWED_ORIGINS isn't sensitive but goes through `secret:` (sourced from the
# deploy environment / .kamal/secrets) rather than a hardcoded `clear:` value,
# since it changes as Vercel domains do.
#
# R2_* deliberately omitted for now: DocumentsService builds its S3 client
# lazily, so the app boots and serves everything except document upload/
# download without them. Add the four R2_* vars back here (and export them)
# when the documents feature is wired up / tested.
env:
  secret:
    - SUPABASE_URL
    - SUPABASE_ANON_KEY
    - SUPABASE_SERVICE_ROLE_KEY
    - ALLOWED_ORIGINS

ssh:
  user: deploy

# Accessories share the `kamal` Docker network. The app reaches them by
# container name: `vastos-api-postgres:5432`, `vastos-api-minio:9000`.
# Both publish ONLY to 127.0.0.1 on the host — never public. `kamal deploy`
# does NOT manage these; boot/reboot them explicitly with `kamal accessory`.
accessories:
  postgres:
    image: pgvector/pgvector:pg17
    host: 89.116.121.54
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: vastos
        POSTGRES_DB: vastos
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    cmd: "postgres -c shared_buffers=2GB -c effective_cache_size=8GB -c max_connections=100 -c shared_preload_libraries=pg_stat_statements"

  minio:
    image: minio/minio:latest
    host: 89.116.121.54
    port: "127.0.0.1:9000:9000"
    cmd: "server /data"
    env:
      clear:
        MINIO_ROOT_USER: vastos-files
        MINIO_BROWSER: "off"
      secret:
        - MINIO_ROOT_PASSWORD
    volumes:
      - /data/minio:/data
