service: vastos-api
image: kavinram247/vastos-api

builder:
  arch: amd64

servers:
  web:
    hosts:
      - 89.116.121.54

# kamal-proxy owns 80/443 on the server: health-checked container swap,
# zero downtime, automatic rollback on failed health check, and its own
# Let's Encrypt TLS.
proxy:
  ssl: true
  host: api.vastos.in
  app_port: 3000
  healthcheck:
    path: /health
    interval: 5
    timeout: 5

registry:
  server: ghcr.io
  username: kavinram247
  password:
    - KAMAL_REGISTRY_PASSWORD

# ALLOWED_ORIGINS isn't sensitive but goes through `secret:` (sourced from the
# deploy environment / .kamal/secrets) rather than a hardcoded `clear:` value,
# since it changes as Vercel domains do.
env:
  clear:
    # Document storage moved off R2 onto the minio accessory below (Phase 5,
    # item 3.8) — same credentials the accessory itself uses, so the app
    # authenticates as the accessory's root user. MINIO_ENDPOINT is the
    # accessory's container name on the shared `kamal` network, not a public
    # URL — there is no public MinIO endpoint, uploads/downloads proxy
    # through this app instead (see DocumentsController).
    MINIO_ROOT_USER: vastos-files
    MINIO_ENDPOINT: http://vastos-api-minio:9000
    MINIO_BUCKET_NAME: vastos-documents
  secret:
    - SUPABASE_URL
    - SUPABASE_ANON_KEY
    - SUPABASE_SERVICE_ROLE_KEY
    - ALLOWED_ORIGINS
    # Direct Postgres for the /api/* data layer (Phase 5, item 2). Connects as
    # the non-superuser `vastos_app` role over the private `kamal` network:
    #   postgres://vastos_app:<pw>@vastos-api-postgres:5432/vastos
    # The app boots without it (endpoints 503 until set).
    - DATABASE_URL
    # Same secret the minio accessory below already uses to boot itself.
    - MINIO_ROOT_PASSWORD

ssh:
  user: deploy

# Accessories share the `kamal` Docker network. The app reaches them by
# container name: `vastos-api-postgres:5432`, `vastos-api-minio:9000`.
# Both publish ONLY to 127.0.0.1 on the host — never public. `kamal deploy`
# does NOT manage these; boot/reboot them explicitly with `kamal accessory`.
accessories:
  postgres:
    image: pgvector/pgvector:pg17
    host: 89.116.121.54
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: vastos
        POSTGRES_DB: vastos
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    cmd: "postgres -c shared_buffers=2GB -c effective_cache_size=8GB -c max_connections=100 -c shared_preload_libraries=pg_stat_statements"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    host: 89.116.121.54
    port: "127.0.0.1:9000:9000"
    cmd: "server /data"
    env:
      clear:
        MINIO_ROOT_USER: vastos-files
        MINIO_BROWSER: "off"
      secret:
        - MINIO_ROOT_PASSWORD
    volumes:
      - /data/minio:/data
